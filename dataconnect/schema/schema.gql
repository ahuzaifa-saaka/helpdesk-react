type User @table {
  displayName: String!
  email: String!
  createdAt: Timestamp!
  userType: String!
  photoUrl: String
  phoneNumber: String
}

type Category @table {
  name: String!
  createdAt: Timestamp!
  description: String
}

type Ticket @table {
  subject: String!
  description: String!
  status: String!
  priority: String!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  resolvedAt: Timestamp
  submitter: User
  assignedAgent: User
  category: Category
}

type Comment @table {
  content: String!
  createdAt: Timestamp!
  isPublic: Boolean!
  user: User
  ticket: Ticket
}

type Attachment @table {
  fileName: String!
  fileUrl: String!
  mimeType: String!
  createdAt: Timestamp!
  ticket: Ticket
  comment: Comment
}